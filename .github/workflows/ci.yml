# CI thật cho MuLon (sửa 1.6.3).
# Trước đợt này repo không có file này, nên mọi badge/claim "CI đang
# chạy" đều sai — chỉ được nói CI chạy sau khi file này đã merge.
# Lưu ý: pytest nằm trong requirements-dev.txt, không phải
# requirements.txt, nên CI cài cả hai; chỉ cài requirements.txt thì
# lệnh pytest sẽ không tìm thấy pytest và CI fail ngay.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
